:root{

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;text-size-adjust:100%;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{width:1.25em;height:1.25em;flex:none}
#app{max-width:520px;margin:0 auto;padding-block:14px 132px;min-height:100vh}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tiny{font-size:12px;letter-spacing:.04em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.tnum{font-variant-numeric:tabular-nums}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .22em;border-radius:3px;font-weight:600}

/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:700;font-size:16px;

.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-height:56px;font-size:17px}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2);min-height:44px;font-weight:600}
.btn.danger{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn.sm{min-height:44px;font-size:15px;padding:0 16px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.iconbtn.lg{width:64px;height:64px}
.iconbtn.lg .ic{width:28px;height:28px}
.iconbtn.plain{background:none;color:var(--ink2)}

/* thẻ & chip */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.banner{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.banner.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.banner.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.banner.acc{background:var(--accent-soft);border-color:transparent}

/* trang chủ */
.hero{padding:6px 2px 4px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.streak.on{color:#d9480f;background:#fff0e6;border-color:transparent}
:root[data-theme="dark"] .streak.on{color:#ffb27a;background:#43261a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .streak.on{color:#ffb27a;background:#43261a}}
.dayno{font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.dayno small{font-size:22px;color:var(--ink3);font-weight:600}
.bar{position:relative;height:10px;border-radius:999px;background:var(--h0);overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent);min-width:10px}
.bar>b{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink3);opacity:.5;border-radius:1px}
.barlabels{position:relative;height:18px;margin-top:6px;font-size:11px;color:var(--ink3)}
.barlabels span{position:absolute;transform:translateX(-50%);white-space:nowrap}

.stage{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line)}
.stage .no{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid var(--ink3);color:var(--ink2);flex:none}
.stage.active{border-color:var(--accent);box-shadow:var(--shadow)}
.stage.active .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage.done .no{background:var(--good);border-color:var(--good);color:#fff}
.stage.locked{background:transparent;border-style:dashed}
.stage.locked .t{color:var(--ink3)}
.stage .t{font-weight:700;font-size:17px;line-height:1.3}
.stage .s{font-size:14px;color:var(--ink2);margin-top:2px}
.stage .btn{margin-top:12px}

/* tab bar & dock */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;font-size:12px;font-weight:600;color:var(--ink3);position:relative}
.tab .ic{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top,var(--bg) 78%,transparent);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.dock-in .btn{flex:1}

/* màn hình tập trung */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pbar{flex:1;height:8px;border-radius:999px;background:var(--h0);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.count{font-weight:700;font-size:14px;color:var(--ink2);min-width:3.2em;text-align:right}

/* flashcard */
.flash{display:flex;flex-direction:column;min-height:min(60vh,520px);padding:20px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  animation:flip .26s ease}
@keyframes flip{from{transform:perspective(900px) rotateY(80deg);opacity:.2}to{transform:perspective(900px) rotateY(0);opacity:1}}
.flash.front{align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer;background-image:none}
.flash .hw{font-size:clamp(34px,11vw,48px);line-height:1.1;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.ipa{font-family:var(--font-ipa);font-size:19px;color:var(--ink2)}
.flash .meaning{font-size:26px;font-weight:800;line-height:1.25}
.flash .hint{font-size:13px;color:var(--ink3);margin-top:8px}
.sect{margin-top:14px}
.sect h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.ex{font-size:17px;line-height:1.55}
.exvi{color:var(--ink2);font-size:15px;margin-top:2px}
.conf{padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.conf b{font-weight:700}
.rate{flex:1;min-height:60px;border-radius:16px;font-weight:800;font-size:16px;border:1.5px solid transparent}
.rate.r-hard{background:var(--bad-bg);color:var(--bad)}
.rate.r-unsure{background:var(--warn-bg);color:var(--warn)}
.rate.r-known{background:var(--good-bg);color:var(--good)}

/* câu hỏi */
.qcard{padding:20px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.qlabel{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.qword{font-size:clamp(30px,9vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.qmean{font-size:24px;font-weight:700;line-height:1.3}
.sentence{font-size:19px;line-height:1.7;text-align:left;width:100%}
.gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);margin:0 .15em;text-align:center;font-weight:700}
.gap.fill{border-color:var(--good);color:var(--good)}
.gap.wrong{border-color:var(--bad);color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;gap:14px;align-items:center;width:100%;min-height:58px;padding:10px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-align:left;font-size:17px;line-height:1.35}
.opt:active{background:var(--surface2)}
.bub{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink3);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink2)}
.opt .otxt{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.good .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.opts.locked{pointer-events:none}
.spellrow{display:flex;gap:10px;margin-top:14px}
.spell{flex:1;min-width:0;height:58px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-size:22px;font-weight:700;letter-spacing:.02em}
.spell:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.spell.good{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.spell.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.hintline{font-family:var(--font-ipa);letter-spacing:.2em;color:var(--ink3);font-size:18px}
.fb{margin-top:14px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}
.fb.ok{border-color:var(--good);background:var(--good-bg)}
.fb.no{border-color:var(--bad);background:var(--bad-bg)}
.fb .head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.fb.ok .head{color:var(--good)} .fb.no .head{color:var(--bad)}
.fb .w{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);color:var(--ink)}
.fb .hwline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb .hwline b{font-size:20px}
.linkbtn{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px}

/* kết quả */
.score{text-align:center;padding:26px 16px}
.score .big{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1}
.score .big small{font-size:28px;color:var(--ink3);font-weight:600}
.wlist{display:flex;flex-direction:column;gap:10px}
.witem{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.witem summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.witem summary::-webkit-details-marker{display:none}
.witem .wh{font-weight:800;font-size:18px}
.witem .wm{color:var(--ink2);font-size:14px}
.witem .det{padding-top:8px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--bad-bg);color:var(--bad)}

/* thống kê */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.tile .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile .l{font-size:13px;color:var(--ink2);margin-top:2px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.hm{aspect-ratio:1;border-radius:3px;background:var(--h0);display:block}
.hm.l1{background:var(--h1)} .hm.l2{background:var(--h2)} .hm.l3{background:var(--h3)} .hm.l4{background:var(--h4)}
.hm.x{background:transparent}
.hm.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink3)}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.stackbar{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:transparent}
.stackbar i{display:block;min-width:0}
.seg0{background:var(--h1)} .seg1{background:var(--h2)} .seg2{background:var(--h3)} .seg3{background:var(--h4)}
.keyrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-top:8px}
.keyrow span{display:inline-flex;align-items:center;gap:6px}
.keyrow i{width:10px;height:10px;border-radius:3px;display:block}
.trow{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 0}
.trow .tb{flex:1;height:10px;border-radius:5px;background:var(--h0);overflow:hidden}
.trow .tb i{display:block;height:100%;background:var(--accent);border-radius:5px}

/* cài đặt */
.setgrp{display:flex;flex-direction:column;gap:14px}
.fieldrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.range{width:100%;height:36px;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.seg button{min-height:44px;border-radius:10px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.switch{position:relative;width:54px;height:32px;border-radius:16px;background:var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(22px)}
select.sel{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px}
textarea.ta{width:100%;min-height:140px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.pagehead{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 2px 14px}
.empty{text-align:center;padding:36px 20px;color:var(--ink2)}

/* modal & toast */
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px;font-weight:800}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:min(92vw,420px);text-align:center;box-shadow:var(--shadow)}

@media (prefers-reduced-motion:reduce){.flash{animation:none}.pbar>i,.switch,.switch::after{transition:none}}
@media (min-width:600px){#app{padding-top:28px}}

</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* ====== CẤU HÌNH (có thể sửa) ====== */
const TARGET_WORDS=3000;          // mục tiêu tổng số từ, dùng để tính "Ngày X/120"
const REVIEW_CAP=60;              // tối đa số từ ôn mỗi ngày
const INTERVALS=[1,3,7,14,30];    // các mốc ôn tập (ngày)
const MASTER_REPEAT=60;           // từ đã qua mốc 30 ngày: nhắc lại sau số ngày này
const KEY='toeic-vocab-v1';

/* ====== TIỆN ÍCH ====== */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const uniq=a=>[...new Set(a)];
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const svg=d=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const I={
  spk:svg('<path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/>'),
  check:svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  lock:svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>'),
  flame:svg('<path d="M12 3c1 3 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>'),
  home:svg('<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>'),
  note:svg('<path d="M6 3h12v18l-6-4-6 4V3z"/>'),
  chart:svg('<path d="M5 20V10M12 20V4M19 20v-7"/>'),
  gear:svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'),
  x:svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  back:svg('<path d="M15 5l-7 7 7 7"/>'),
  flip:svg('<path d="M4 12a8 8 0 0114-5l2 2"/><path d="M20 12a8 8 0 01-14 5l-2-2"/><path d="M20 4v5h-5M4 20v-5h5"/>')
};
const POS={n:'danh từ',v:'động từ',adj:'tính từ',adv:'trạng từ',prep:'giới từ',conj:'liên từ'};
const posVi=p=>String(p||'').split('/').map(x=>POS[x.trim()]||x.trim()).join(' / ');
const posKey=w=>String(w.pos||'').split('/')[0].trim();
const KIND={review:'Ôn tập',quiz:'Kiểm tra cuối bài',weekly:'Ôn tổng tuần',mini:'Mini test 30 ngày',hard:'Ôn sổ tay từ khó'};
const fmtShort=s=>{const [y,m,d]=s.split('-');return d+'/'+m;};
const fmtLong=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y;};

/* ====== NGÀY GIỜ ====== */
const nowFn=()=>window.__NOW?new Date(window.__NOW):new Date();
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const today=()=>ymd(nowFn());
function parseD(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}

/* ====== DỮ LIỆU TỪ VỰNG ====== */
let RAW=[],dataError=null;
try{
  RAW=JSON.parse(document.getElementById('vocab-data').textContent);
  if(!Array.isArray(RAW)) throw new Error('Dữ liệu từ vựng phải là một mảng [ ... ].');
}catch(e){dataError=e.message;RAW=[];}
const VOCAB=RAW.filter(w=>w&&typeof w.id==='number'&&w.word).sort((a,b)=>a.id-b.id);
const BY_ID=new Map(VOCAB.map(w=>[w.id,w]));
const famForms=w=>uniq((w.family||[]).map(s=>String(s).replace(/\s*\(.*?\)\s*/g,'').trim()).filter(Boolean));
function clozeOf(w){const m=/\{([^}]+)\}/.exec(w.example||'');return m?{answer:m[1],before:w.example.slice(0,m.index).replace(/[{}]/g,''),after:w.example.slice(m.index+m[0].length).replace(/[{}]/g,'')}:null;}
const plainEx=w=>String(w.example||'').replace(/[{}]/g,'');
const hiEx=w=>esc(w.example).replace(/\{([^}]+)\}/g,'<mark>$1</mark>');
function dataReport(){
  const issues=[],ids=new Set(),words=new Map();
  const need=['id','day','topic','word','pos','ipa','meaning','example','exampleVi'];
  RAW.forEach((w,i)=>{
    if(!w||typeof w!=='object'){issues.push('Mục #'+(i+1)+' không hợp lệ');return;}
    need.forEach(k=>{if(w[k]===undefined||w[k]===''){issues.push('Từ "'+(w.word||'#'+(i+1))+'" thiếu trường '+k);}});
    if(ids.has(w.id)) issues.push('Trùng id '+w.id); ids.add(w.id);
    const lw=String(w.word||'').toLowerCase();
    if(lw){if(words.has(lw)) issues.push('Trùng từ "'+w.word+'" (id '+words.get(lw)+' và '+w.id+')'); else words.set(lw,w.id);}
    if(w.example&&!/\{[^}]+\}/.test(w.example)) issues.push('Câu ví dụ của "'+w.word+'" chưa đặt {từ} trong ngoặc nhọn');
  });
  return issues;
}

/* ====== TRẠNG THÁI & LƯU TRỮ ====== */
function fresh(){return{v:1,settings:{perDay:25,theme:'auto',rate:0.9,voiceURI:'',noListen:false},
  progress:{lessonsDone:0,streak:0,best:0,lastDay:null,weeklyTaken:0,miniTaken:0,lastBackup:null},
  cards:{},log:{},tests:[],day:{date:null,reviewDone:false,learned:false,quizDone:false,ids:[]},lesson:null,run:null};}
function normalize(o){
  const f=fresh();if(!o||typeof o!=='object') return f;
  const s=Object.assign({},f,o);
  s.settings=Object.assign({},f.settings,o.settings||{});
  s.progress=Object.assign({},f.progress,o.progress||{});
  s.day=Object.assign({},f.day,o.day||{});
  s.cards=o.cards&&typeof o.cards==='object'?o.cards:{};
  s.log=o.log&&typeof o.log==='object'?o.log:{};
  s.tests=Array.isArray(o.tests)?o.tests:[];
  s.settings.perDay=Math.min(40,Math.max(20,Math.round(+s.settings.perDay||25)));
  return s;
}
let storageOK=true,warned=false;
function loadRaw(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){storageOK=false;return null;}}
let S=normalize(loadRaw());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;if(!warned){warned=true;toast('Trình duyệt không cho lưu dữ liệu. Hãy xuất file JSON để sao lưu.');}}}

function ensureDay(){
  const t=today();
  if(S.day.date!==t){
    S.day={date:t,reviewDone:false,learned:false,quizDone:false,ids:[]};
    if(S.run&&S.run.date!==t) S.run=null;
    save();
  }
}

/* ====== THẺ TỪ & LỊCH ÔN ====== */
const learnedCount=()=>Object.keys(S.cards).filter(k=>BY_ID.has(+k)).length;
const dueIds=()=>{const t=today();return Object.keys(S.cards).map(Number).filter(id=>BY_ID.has(id)&&S.cards[id].due<=t);};
const hardIds=()=>Object.keys(S.cards).map(Number).filter(id=>{const c=S.cards[id];return BY_ID.has(id)&&c.wrong>=2&&(c.run||0)<3;}).sort((a,b)=>S.cards[b].wrong-S.cards[a].wrong);
const cardsInLessons=(a,b)=>Object.keys(S.cards).map(Number).filter(id=>{const c=S.cards[id];return BY_ID.has(id)&&c.lesson>=a&&c.lesson<=b;});
function newCard(rate,lessonNo){return{box:0,due:addDays(today(),1),seen:0,right:0,wrong:0,run:0,rate:rate,lesson:lessonNo,learned:today()};}
function buildReviewIds(){
  const t=today(),due=dueIds(),last=S.progress.lessonsDone;
  const prio=[],rest=[];
  due.forEach(id=>(S.cards[id].lesson===last?prio:rest).push(id));
  rest.sort((a,b)=>{const ca=S.cards[a],cb=S.cards[b];return (diffDays(cb.due,t)-diffDays(ca.due,t))||(ca.box-cb.box)||(Math.random()-.5);});
  return shuffle(prio.concat(rest).slice(0,REVIEW_CAP));
}
function applyAnswer(c,id,ok,mode,r){
  const t=today(),tm=addDays(t,1);
  c.seen=(c.seen||0)+1;
  if(ok){
    c.right=(c.right||0)+1;c.run=(c.run||0)+1;
    if(mode==='review'){c.box=Math.min(5,(c.box||0)+1);c.due=addDays(t,c.box>=5?MASTER_REPEAT:INTERVALS[c.box]);}
  }else{
    c.run=0;
    if(r.wrong.indexOf(id)<0){c.wrong=(c.wrong||0)+1;r.wrong.push(id);}
    if(mode==='review'){c.box=0;c.due=tm;}
    else if(mode==='extra'){c.box=0;if(c.due>tm) c.due=tm;}
  }
}
function logAnswer(ok){const t=today(),L=S.log[t]||(S.log[t]={n:0,q:0,ok:0});L.q++;if(ok)L.ok++;}
function logNew(n){const t=today(),L=S.log[t]||(S.log[t]={n:0,q:0,ok:0});L.n+=n;}
function markStudyDay(){
  const t=today(),p=S.progress;if(p.lastDay===t) return;
  p.streak=(p.lastDay===addDays(t,-1))?p.streak+1:1;p.best=Math.max(p.best||0,p.streak);p.lastDay=t;
}
function curStreak(){const p=S.progress,t=today();return(p.lastDay===t||p.lastDay===addDays(t,-1))?p.streak:0;}

/* ====== PHÁT ÂM (Web Speech API, giọng Anh-Mỹ) ====== */
const hasTTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let voices=[];
function refreshVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){}}
if(hasTTS){refreshVoices();try{speechSynthesis.onvoiceschanged=refreshVoices;}catch(e){}}
function pickVoice(){
  if(S.settings.voiceURI){const v=voices.find(v=>v.voiceURI===S.settings.voiceURI);if(v) return v;}
  const us=voices.filter(v=>/^en[-_]US/i.test(v.lang));
  const pref=['Samantha','Google US English','Aria','Jenny','Zira','Alex','Nicky'];
  for(const n of pref){const v=us.find(v=>v.name.indexOf(n)>=0);if(v) return v;}
  return us[0]||voices.find(v=>/^en/i.test(v.lang))||null;
}
function speak(text){
  if(!hasTTS||!text) return false;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';const v=pickVoice();if(v)u.voice=v;u.rate=S.settings.rate||0.9;speechSynthesis.speak(u);return true;}catch(e){return false;}
}
const canListen=()=>hasTTS&&!S.settings.noListen;

/* ====== TẠO CÂU HỎI ====== */
const TYPE_POOLS=[
  ['en2vi','listen','vi2en'],
  ['en2vi','vi2en','listen','cloze'],
  ['vi2en','cloze','listen','cloze'],
  ['cloze','spell','vi2en','listen'],
  ['cloze','spell','listen','vi2en','spell'],
  ['cloze','spell','listen']
];
function pickType(c,mode){
  let pool=mode==='quiz'?['en2vi','vi2en','listen','cloze']:TYPE_POOLS[Math.min(5,c?c.box||0:0)];
  if(!canListen()) pool=pool.filter(t=>t!=='listen');
  return pickOne(pool.length?pool:['en2vi']);
}
function distractors(w,n,keyFn){
  const out=[],seen=new Set([keyFn(w)]);
  const add=x=>{if(!x||x.id===w.id||out.length>=n) return;const k=keyFn(x);if(!k||seen.has(k)) return;seen.add(k);out.push(x);};
  (w.confusable||[]).forEach(c=>add(VOCAB.find(v=>v.word.toLowerCase()===String(c.w).toLowerCase())));
  shuffle(VOCAB.filter(v=>v.id!==w.id&&v.topic===w.topic&&posKey(v)===posKey(w))).forEach(add);
  shuffle(VOCAB.filter(v=>v.id!==w.id&&posKey(v)===posKey(w))).forEach(add);
  shuffle(VOCAB.filter(v=>v.id!==w.id)).forEach(add);
  return out;
}
function makeQ(id,type){
  const w=BY_ID.get(id);
  if(type==='listen'&&!canListen()) type='vi2en';
  let c=null;
  if(type==='cloze'){c=clozeOf(w);if(!c) type='en2vi';}
  if(type==='en2vi'||type==='vi2en'||type==='listen'){
    const ds=distractors(w,3,type==='en2vi'?x=>x.meaning:x=>x.word.toLowerCase());
    const o=shuffle([w.id].concat(ds.map(d=>d.id)));
    return{id:id,t:type,o:o,a:o.indexOf(w.id)};
  }
  if(type==='cloze'){
    const ans=c.answer.toLowerCase(),seen=new Set([ans]),forms=[];
    const add=f=>{const k=String(f).toLowerCase();if(!f||seen.has(k)) return;seen.add(k);forms.push(f);};
    shuffle(famForms(w).concat([w.word])).forEach(add);
    let opts=forms.slice(0,3);
    if(opts.length<3){
      const fill=shuffle(VOCAB.filter(v=>v.id!==w.id&&posKey(v)===posKey(w)).map(v=>v.word)).concat(shuffle(VOCAB.filter(v=>v.id!==w.id).map(v=>v.word)));
      for(const f of fill){if(opts.length>=3) break;const k=f.toLowerCase();if(seen.has(k)) continue;seen.add(k);opts.push(f);}
    }
    const o=shuffle([c.answer].concat(opts));
    return{id:id,t:'cloze',o:o,a:o.indexOf(c.answer)};
  }
  return{id:id,t:'spell'};
}

/* ====== PHIÊN LÀM BÀI ====== */
let view={name:'home'};
function startRun(kind){
  ensureDay();
  if(S.run&&S.run.kind===kind){view={name:'quiz',autoplay:true};render();return;}
  let ids=[];
  if(kind==='review') ids=buildReviewIds();
  else if(kind==='quiz') ids=S.day.ids.filter(id=>BY_ID.has(id)&&S.cards[id]);
  else if(kind==='weekly'){const k=Math.floor(S.progress.lessonsDone/7);ids=shuffle(cardsInLessons(7*(k-1)+1,7*k)).slice(0,50);}
  else if(kind==='mini'){const m=Math.floor(S.progress.lessonsDone/30);ids=shuffle(cardsInLessons(30*(m-1)+1,30*m)).slice(0,40);}
  else if(kind==='hard') ids=shuffle(hardIds()).slice(0,20);
  if(!ids.length){
    if(kind==='review'){S.day.reviewDone=true;save();render();return;}
    toast('Chưa có từ nào cho bài này.');return;
  }
  let qs;
  if(kind==='quiz'){
    qs=ids.map(id=>makeQ(id,pickType(S.cards[id],'quiz')));
    const weak=ids.filter(id=>{const r=S.cards[id].rate;return r==='hard'||r==='unsure';});
    shuffle(weak).slice(0,10).forEach(id=>{
      const used=qs.find(q=>q.id===id).t;
      const alt=['en2vi','vi2en','listen','cloze'].filter(t=>t!==used&&(t!=='listen'||canListen()));
      qs.push(makeQ(id,pickOne(alt)));
    });
    qs=shuffle(qs);
  }else qs=ids.map(id=>makeQ(id,pickType(S.cards[id],kind)));
  S.run={kind:kind,date:today(),qs:qs,i:0,res:[],wrong:[]};
  save();view={name:'quiz',autoplay:true};render();
}
function recordAnswer(ok){
  const r=S.run,q=r.qs[r.i],c=S.cards[q.id];
  const mode=r.kind==='review'?'review':r.kind==='quiz'?'quiz':'extra';
  if(c) applyAnswer(c,q.id,ok,mode,r);
  r.res.push({id:q.id,t:q.t,ok:ok});
  logAnswer(ok);view.ok=ok;save();
}
function finishRun(){
  const r=S.run,kind=r.kind,total=r.res.length,okN=r.res.filter(x=>x.ok).length;
  const wrongIds=uniq(r.res.filter(x=>!x.ok).map(x=>x.id));
  const p=S.progress;let prevMini=null;
  if(kind==='review') S.day.reviewDone=true;
  if(kind==='quiz') S.day.quizDone=true;
  if(kind==='weekly'){p.weeklyTaken=Math.floor(p.lessonsDone/7);S.tests.push({type:'weekly',date:today(),ok:okN,n:total,lessons:p.lessonsDone});}
  if(kind==='mini'){
    prevMini=S.tests.filter(t=>t.type==='mini').slice(-1)[0]||null;
    p.miniTaken=Math.floor(p.lessonsDone/30);S.tests.push({type:'mini',date:today(),ok:okN,n:total,lessons:p.lessonsDone});
  }
  if(kind==='review'&&!VOCAB.some(w=>!S.cards[w.id])) markStudyDay();
  S.run=null;save();
  view={name:'result',kind:kind,total:total,ok:okN,wrongIds:wrongIds,prevMini:prevMini};render();
}

/* ====== HỌC TỪ MỚI ====== */
function startLearn(){
  ensureDay();
  if(!S.lesson){
    const ids=VOCAB.filter(w=>!S.cards[w.id]).slice(0,S.settings.perDay).map(w=>w.id);
    if(!ids.length){toast('Đã học hết các từ hiện có.');return;}
    S.lesson={ids:ids,idx:0,rates:{}};save();
  }
  view={name:'learn',flipped:false};render();
}
function finishLearn(){
  const L=S.lesson,no=S.progress.lessonsDone+1,cnt={known:0,unsure:0,hard:0};
  L.ids.forEach(id=>{const r=L.rates[id]||'known';cnt[r]++;S.cards[id]=newCard(r,no);});
  S.progress.lessonsDone=no;
  S.day.learned=true;S.day.quizDone=false;S.day.ids=L.ids.slice();
  logNew(L.ids.length);markStudyDay();S.lesson=null;save();
  view={name:'learnDone',cnt:cnt,n:L.ids.length};render();
}

/* ====== HIỂN THỊ ====== */
function render(keepScroll){
  ensureDay();
  let html='';
  switch(view.name){
    case 'home':html=viewHome();break;
    case 'hard':html=viewHard();break;
    case 'stats':html=viewStats();break;
    case 'settings':html=viewSettings();break;
    case 'learn':html=S.lesson?viewLearn():(view={name:'home'},viewHome());break;
    case 'learnDone':html=viewLearnDone();break;
    case 'quiz':html=S.run?viewQuiz():(view={name:'home'},viewHome());break;
    case 'result':html=viewResult();break;
    default:view={name:'home'};html=viewHome();
  }
  $('#app').innerHTML=html;
  if(!keepScroll) window.scrollTo(0,0);
  afterRender();
}
function afterRender(){
  if(view.name==='quiz'&&S.run){
    const q=S.run.qs[S.run.i];
    const sp=$('#spellIn');if(sp&&!view.done){try{sp.focus({preventScroll:true});}catch(e){}}
    if(view.autoplay){view.autoplay=false;if(q&&q.t==='listen'&&!view.done) speak(BY_ID.get(q.id).word);}
    if(view.done){const fb=$('#fb');if(fb&&fb.scrollIntoView){try{fb.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}}}
  }
}

  return topBar(r.i,n,KIND[r.kind])+'<div class="eyebrow" style="margin:-4px 2px 10px">'+esc(KIND[r.kind])+'</div><div class="stack" style="gap:0">'+body+fb+'</div>'+dock;
}

    +(withTag&&c?'<span class="tag">sai '+c.wrong+' lần</span>':'')+'<span data-act="say" data-w="'+w.id+'" class="iconbtn" role="button" aria-label="Nghe phát âm">'+I.spk+'</span></summary>'
    +'<div class="det"><div class="ex">'+hiEx(w)+'</div><div class="exvi">'+esc(w.exampleVi)+'</div>'
    +((w.collocations||[]).length?'<div class="chips" style="margin-top:8px">'+w.collocations.map(x=>'<span class="chip acc">'+esc(x)+'</span>').join('')+'</div>':'')+'</div></details>';

function viewResult(){
  const v=view,pct=v.total?Math.round(v.ok/v.total*100):0;
  const msg=pct>=90?'Rất tốt! Bạn nắm chắc phần này.':pct>=70?'Khá ổn. Xem lại vài từ sai bên dưới.':'Cần ôn thêm. Các từ sai sẽ quay lại sớm.';
  let extra='';
  if(v.kind==='mini'&&v.prevMini){
    const pp=Math.round(v.prevMini.ok/v.prevMini.n*100),df=pct-pp;
    extra='<div class="small muted" style="margin-top:6px">Lần trước: '+pp+'% · '+(df>=0?'tăng ':'giảm ')+Math.abs(df)+' điểm phần trăm</div>';
  }
  const p=S.progress;
  let ctas='';
  if(v.kind==='review'&&!S.day.learned&&VOCAB.some(w=>!S.cards[w.id])) ctas=dockHtml('<button class="btn" data-act="goHome">Để sau</button><button class="btn primary" data-act="startLearn">Học từ mới</button>');
  else if(v.kind==='hard') ctas=dockHtml('<button class="btn primary" data-act="nav" data-v="hard">Về sổ tay</button>');
  else{
    const more=[];
    if(v.kind==='quiz'){
      if(Math.floor(p.lessonsDone/30)>p.miniTaken) more.push('<button class="btn soft" data-act="startMini">Làm mini test 30 ngày</button>');
      if(Math.floor(p.lessonsDone/7)>p.weeklyTaken) more.push('<button class="btn soft" data-act="startWeekly">Làm bài ôn tổng tuần</button>');
    }
    ctas=dockHtml('<button class="btn primary" data-act="goHome">Về trang chủ</button>');
    if(more.length) extra+='<div class="stack" style="margin-top:12px">'+more.join('')+'</div>';
  }
  return '<div class="stack"><div class="card score"><div class="eyebrow">'+esc(KIND[v.kind])+'</div><div class="big tnum" style="margin:8px 0">'+v.ok+'<small>/'+v.total+'</small></div><div style="font-weight:700">'+pct+'% · '+msg+'</div>'+extra+'</div>'
    +(v.wrongIds.length?'<h2 style="font-size:17px;margin:6px 2px 0">Từ cần xem lại ('+v.wrongIds.length+')</h2><div class="wlist">'+v.wrongIds.map(id=>wordItem(id)).join('')+'</div>':'<div class="empty">Không sai từ nào. Tuyệt vời!</div>')+'</div>'+ctas;
}

/* --- Thống kê --- */
function totalsLog(){
  let q=0,ok=0,q7=0,ok7=0;const t=today();
  for(const k in S.log){const L=S.log[k],df=diffDays(k,t);q+=L.q||0;ok+=L.ok||0;if(df>=0&&df<7){q7+=L.q||0;ok7+=L.ok||0;}}
  return{q:q,ok:ok,q7:q7,ok7:ok7};
}
function heatHtml(){
  const t=today(),weeks=17,dow=(parseD(t).getDay()+6)%7,start=addDays(t,-(dow+(weeks-1)*7));
  let cells='';
  for(let c=0;c<weeks;c++)for(let r=0;r<7;r++){
    const ds=addDays(start,c*7+r);
    if(ds>t){cells+='<i class="hm x"></i>';continue;}
    const L=S.log[ds],n=L?(L.q||0)+(L.n||0):0,lv=n===0?0:n<15?1:n<40?2:n<80?3:4;
    cells+='<i class="hm l'+lv+(ds===t?' today':'')+'" data-act="hm" data-d="'+ds+'" data-n="'+n+'"></i>';
  }
  return '<div class="heat" aria-label="Lịch học 17 tuần gần nhất">'+cells+'</div>';
}
function viewStats(){
  const ids=Object.keys(S.cards).map(Number).filter(id=>BY_ID.has(id)),T=totalsLog();
  const known=ids.filter(id=>S.cards[id].box>=3).length,master=ids.filter(id=>S.cards[id].box>=5).length;
  const seg=[ids.filter(id=>S.cards[id].box===0).length,ids.filter(id=>S.cards[id].box>=1&&S.cards[id].box<=2).length,ids.filter(id=>S.cards[id].box>=3&&S.cards[id].box<=4).length,master];
  const acc=T.q?Math.round(T.ok/T.q*100):null,acc7=T.q7?Math.round(T.ok7/T.q7*100):null;
  const minis=S.tests.filter(t=>t.type==='mini'),weeks=S.tests.filter(t=>t.type==='weekly').slice(-4);
  const trow=t=>{const pc=Math.round(t.ok/t.n*100);return '<div class="trow"><span class="small muted tnum" style="width:3.6em">'+fmtShort(t.date)+'</span><div class="tb"><i style="width:'+pc+'%"></i></div><b class="tnum" style="width:3em;text-align:right">'+pc+'%</b></div>';};
  const segTxt=['Mới học','Đang nhớ','Đã thuộc','Thành thạo'];
  let h='<div class="pagehead">Thống kê</div><div class="tiles">'
    +'<div class="tile"><div class="v tnum">'+ids.length+'</div><div class="l">từ đã học</div></div>'
    +'<div class="tile"><div class="v tnum">'+known+'</div><div class="l">từ đã thuộc (qua mốc ôn 7 ngày)</div></div>'
    +'<div class="tile"><div class="v tnum">'+(acc===null?'–':acc+'%')+'</div><div class="l">tỉ lệ trả lời đúng'+(acc7!==null?' · 7 ngày: '+acc7+'%':'')+'</div></div>'
    +'<div class="tile"><div class="v tnum">'+S.progress.best+'</div><div class="l">chuỗi ngày dài nhất · hiện tại '+curStreak()+'</div></div></div>';
  h+='<div class="card"><div class="eyebrow" style="margin-bottom:10px">Mức độ ghi nhớ</div>'
    +(ids.length?'<div class="stackbar" role="img" aria-label="'+segTxt.map((s,i)=>s+' '+seg[i]).join(', ')+'">'+seg.map((n,i)=>n?'<i class="seg'+i+'" style="flex:'+n+'"></i>':'').join('')+'</div>':'<div class="small muted">Chưa có dữ liệu. Học bài đầu tiên để bắt đầu.</div>')
    +'<div class="keyrow">'+segTxt.map((s,i)=>'<span><i class="seg'+i+'"></i>'+s+' <b class="tnum">'+seg[i]+'</b></span>').join('')+'</div></div>';
  h+='<div class="card"><div class="eyebrow" style="margin-bottom:10px">Lịch học · 17 tuần gần nhất</div>'+heatHtml()
    +'<div class="row" style="justify-content:space-between;margin-top:10px"><span id="hmcap" class="small muted">Chạm vào một ô để xem chi tiết</span><span class="legend">ít<i class="hm" style="width:12px"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i>nhiều</span></div></div>';
  h+='<div class="card"><div class="eyebrow" style="margin-bottom:6px">Mini test 30 ngày</div>'+(minis.length?minis.map(trow).join(''):'<div class="small muted">Mini test đầu tiên mở sau khi bạn hoàn thành bài thứ 30.</div>')
    +(weeks.length?'<div class="eyebrow" style="margin:12px 0 4px">Ôn tổng tuần gần đây</div>'+weeks.map(trow).join(''):'')+'</div>';
  return '<div class="stack">'+h+'</div>'+tabbar('stats');
}

/* ====== HỘP THOẠI & THÔNG BÁO ====== */
let toastT,modalResolve=null;
function toast(m){const t=$('#toast');if(!t) return;t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2800);}
function showModal(inner){const m=$('#modal');m.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+inner+'</div>';m.hidden=false;}
function closeModal(res){const m=$('#modal');m.hidden=true;m.innerHTML='';if(modalResolve){const r=modalResolve;modalResolve=null;r(!!res);}}
function ask(title,body,okLabel,danger){
  return new Promise(res=>{modalResolve=res;showModal('<h2>'+esc(title)+'</h2><p class="muted">'+esc(body)+'</p><div class="stack"><button class="btn '+(danger?'danger':'primary')+'" data-act="modalOk">'+esc(okLabel)+'</button><button class="btn ghost" data-act="modalNo">Hủy</button></div>');});
}

/* ====== XUẤT / NHẬP ====== */
const exportPayload=()=>JSON.stringify({app:'toeic-vocab',version:1,exportedAt:new Date().toISOString(),data:Object.assign({},S,{progress:Object.assign({},S.progress,{lastBackup:today()})})});
function markBackup(){S.progress.lastBackup=today();save();}
async function doExport(){
  const payload=exportPayload(),name='toeic-vocab-sao-luu-'+today()+'.json';
  let dl=null;
  try{if(window.claude&&window.claude.use) dl=await window.claude.use('downloads');}catch(e){dl=null;}
  if(dl){
    try{await dl.save({filename:name,data:payload});markBackup();toast('Đã lưu file sao lưu.');if(view.name==='settings')render(true);return;}
    catch(e){if(e&&e.code==='declined') return;}
  }else if(!window.claude){
    try{
      const blob=new Blob([payload],{type:'application/json'}),a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);markBackup();toast('Đã xuất file sao lưu.');if(view.name==='settings')render(true);return;
    }catch(e){}
  }
  showModal('<h2>Sao chép dữ liệu sao lưu</h2><p class="muted small">Không thể tải file trực tiếp ở đây. Hãy sao chép đoạn văn bản dưới đây và dán vào một ghi chú hoặc file .json để lưu lại.</p><textarea id="exportTa" class="ta" readonly>'+esc(payload)+'</textarea><div class="stack"><button class="btn primary" data-act="copyExport">Sao chép</button><button class="btn ghost" data-act="modalNo">Đóng</button></div>');
}
function openImport(){
  showModal('<h2>Nhập dữ liệu</h2><p class="muted small">Chọn file JSON đã xuất trước đó, hoặc dán nội dung vào ô bên dưới. Dữ liệu hiện tại sẽ bị thay thế.</p>'
    +'<input id="impFile" type="file" accept="application/json,.json,text/plain" aria-label="Chọn file JSON">'
    +'<textarea id="impTa" class="ta" placeholder="Hoặc dán nội dung JSON vào đây…"></textarea>'
    +'<div class="stack"><button class="btn primary" data-act="doImport">Nhập dữ liệu</button><button class="btn ghost" data-act="modalNo">Hủy</button></div>');
}
async function doImport(){
  const ta=$('#impTa');let obj;
  try{obj=JSON.parse(ta.value);}catch(e){toast('Nội dung không phải JSON hợp lệ.');return;}
  const data=obj&&obj.app==='toeic-vocab'?obj.data:null;
  if(!data||typeof data!=='object'||!data.cards||typeof data.cards!=='object'||!data.progress){toast('File này không phải bản sao lưu của ứng dụng.');return;}
  const n=Object.keys(data.cards).length;
  const ok=await ask('Thay thế dữ liệu hiện tại?','Bản sao lưu có '+n+' từ đã học ('+(data.progress.lessonsDone||0)+' bài). Tiến độ hiện tại trên máy này sẽ bị ghi đè.','Nhập dữ liệu',true);
  if(!ok) return;
  S=normalize(data);S.run=null;save();applyTheme();view={name:'home'};render();toast('Đã nhập dữ liệu.');
}

/* ====== GIAO DIỆN SÁNG/TỐI ====== */
const HOST_THEME=document.documentElement.getAttribute('data-theme');
function applyTheme(){
  const el=document.documentElement,t=S.settings.theme;
  if(t==='auto'){if(HOST_THEME) el.setAttribute('data-theme',HOST_THEME);else el.removeAttribute('data-theme');}
  else el.setAttribute('data-theme',t);
}

/* ====== SỰ KIỆN ====== */
const A={
  nav:el=>{view={name:el.dataset.v};render();},
  goHome:()=>{view={name:'home'};render();},
  exit:()=>{save();view={name:'home'};render();},
  startReview:()=>startRun('review'),
  startQuiz:()=>startRun('quiz'),
  startWeekly:()=>startRun('weekly'),
  startMini:()=>startRun('mini'),
  startHard:()=>startRun('hard'),
  startLearn:()=>startLearn(),
  skipWeekly:()=>{S.progress.weeklyTaken=Math.floor(S.progress.lessonsDone/7);save();render(true);},
  skipMini:()=>{S.progress.miniTaken=Math.floor(S.progress.lessonsDone/30);save();render(true);},
  moreLesson:()=>{S.day.learned=false;S.day.quizDone=false;S.day.ids=[];save();startLearn();},
  flip:()=>{view.flipped=!view.flipped;render(true);},
  prevCard:()=>{const L=S.lesson;if(L&&L.idx>0){L.idx--;view.flipped=false;save();render(true);}},
  rate:el=>{
    const L=S.lesson;if(!L||!view.flipped) return;
    L.rates[L.ids[L.idx]]=el.dataset.r;
    if(L.idx+1>=L.ids.length) finishLearn();
    else{L.idx++;view.flipped=false;save();render();}
  },
  say:(el,e)=>{if(e&&e.preventDefault) e.preventDefault();const w=BY_ID.get(+el.dataset.w);if(w&&!speak(w.word)) toast('Thiết bị này chưa hỗ trợ đọc giọng nói.');},
  sayEx:el=>{const w=BY_ID.get(+el.dataset.w);if(w) speak(plainEx(w));},
  pick:el=>{
    if(!S.run||view.done) return;
    const q=S.run.qs[S.run.i],i=+el.dataset.i;
    view.pick=i;view.done=true;recordAnswer(i===q.a);render(true);
  },
  spellCheck:()=>{
    if(!S.run||view.done) return;
    const inp=$('#spellIn');if(!inp) return;
    const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');
    const val=norm(inp.value);if(!val){inp.focus();return;}
    const w=BY_ID.get(S.run.qs[S.run.i].id);
    view.spellVal=inp.value.trim();view.done=true;recordAnswer(val===norm(w.word));render(true);
  },
  spellSkip:()=>{if(!S.run||view.done) return;view.spellVal='';view.done=true;recordAnswer(false);render(true);},
  skipListen:()=>{const r=S.run,q=r.qs[r.i];r.qs[r.i]=makeQ(q.id,'vi2en');save();view={name:'quiz'};render(true);},
  next:()=>{
    const r=S.run;if(!r||!view.done) return;
    r.i++;
    if(r.i>=r.qs.length) finishRun();
    else{save();view={name:'quiz',autoplay:true};render();}
  },
  hm:el=>{const c=$('#hmcap');if(c) c.textContent=fmtLong(el.dataset.d)+': '+(+el.dataset.n?el.dataset.n+' hoạt động':'chưa học');},
  theme:el=>{S.settings.theme=el.dataset.v;save();applyTheme();render(true);},
  toggleListen:()=>{S.settings.noListen=!S.settings.noListen;save();render(true);},
  testVoice:()=>{if(!speak('Welcome to your TOEIC vocabulary practice.')) toast('Thiết bị này chưa hỗ trợ đọc giọng nói.');},
  doExport:()=>{doExport();},
  openImport:openImport,
  doImport:()=>{doImport();},
  copyExport:()=>{
    const ta=$('#exportTa');
    const fallback=()=>{ta.select();try{document.execCommand('copy');toast('Đã sao chép.');}catch(e){toast('Hãy nhấn giữ và chọn Sao chép.');}};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(()=>{markBackup();toast('Đã sao chép.');},fallback);else fallback();
  },
  askReset:async()=>{
    const ok=await ask('Xóa toàn bộ tiến độ?','Mọi từ đã học, lịch ôn, thống kê và cài đặt sẽ bị xóa. Hãy xuất file JSON trước nếu bạn muốn giữ bản sao lưu.','Xóa tất cả',true);
    if(ok){S=fresh();save();applyTheme();view={name:'home'};render();toast('Đã xóa dữ liệu.');}
  },
  modalOk:()=>closeModal(true),
  modalNo:()=>closeModal(false)
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal(false);return;}
  const el=e.target.closest('[data-act]');if(!el) return;
  const f=A[el.dataset.act];if(f) f(el,e);
});
document.addEventListener('input',e=>{
  const el=e.target,b=el.dataset&&el.dataset.bind;if(!b) return;
  if(b==='perDay'){S.settings.perDay=Math.min(40,Math.max(20,+el.value));$('#perDayVal').textContent=S.settings.perDay;$('#perDayNote').textContent=perDayNote();save();}
  else if(b==='rate'){S.settings.rate=+el.value;$('#rateVal').textContent=(+el.value).toFixed(2)+'×';save();}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.bind==='voice'){S.settings.voiceURI=el.value;save();}
  if(el.id==='impFile'&&el.files&&el.files[0]){
    const fr=new FileReader();fr.onload=()=>{$('#impTa').value=String(fr.result||'');};fr.onerror=()=>toast('Không đọc được file này.');fr.readAsText(el.files[0]);
  }
});
document.addEventListener('keydown',e=>{
  const tg=e.target;
  if(tg.matches&&tg.matches('input,textarea,select')){if(tg.id==='spellIn'&&e.key==='Enter'){e.preventDefault();A.spellCheck();}return;}
  if(tg.closest&&tg.closest('button,[role="button"]')&&(e.key==='Enter'||e.key===' ')){if(tg.getAttribute('data-act')==='flip'&&tg.tagName!=='BUTTON'){e.preventDefault();A.flip();}return;}
  if(view.name==='quiz'&&S.run){
    const q=S.run.qs[S.run.i];
    if(!view.done){const m={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3}[String(e.key).toLowerCase()];if(m!==undefined&&q.o&&m<q.o.length) A.pick({dataset:{i:m}});}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();A.next();}
  }else if(view.name==='learn'&&S.lesson){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!view.flipped) A.flip();}
    else if(view.flipped&&'123'.indexOf(e.key)>=0&&e.key) A.rate({dataset:{r:['hard','unsure','known'][+e.key-1]}});
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(view.name==='home'||view.name==='stats')) render(true);});

/* ====== KHỞI ĐỘNG ====== */
document.documentElement.setAttribute('lang','vi');
applyTheme();
render();
})();

</script>

/* Cài đặt dạng ứng dụng: lưu app để dùng offline + xin trình duyệt không tự xoá dữ liệu học */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  });
}
</script>
